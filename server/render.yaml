services:
  - type: web
    name: flappy-royale
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: MONGODB_URI
        sync: false   # set this in the Render dashboard (contains your DB password)
