document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ng:18px 10px;font-family:'Lilita One';font-size:38px;color:#0b3a63;background:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 8px 0 rgba(0,0,0,.1)\">\n          <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#b3261e;font-weight:900;background:#ffe1de;padding:8px 14px;border-radius:12px\">{{ error }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding:18px 30px 30px\">\n          <button sc-camel-on-click=\"{{ onJoinSubmit }}\" style=\"width:100%;border:none;cursor:pointer;font-family:'Lilita One';font-size:22px;color:#fff;padding:17px;border-radius:18px;background:#ffd23f;color:#3a2500;box-shadow:0 6px 0 #c98a00\">JOIN<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= LOBBY ================= -->\n    <sc-if value=\"{{ showLobby }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#1f3b66,#0f1c33)\">\n        <div style=\"padding:20px 22px 6px;display:flex;align-items:center;gap:12px\">\n          <button sc-camel-on-click=\"{{ onLeave }}\" style=\"border:none;background:rgba(255,255,255,.12);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:20px;font-weight:900;color:#fff\">‹<\u002Fbutton>\n          <div style=\"font-family:'Lilita One';font-size:22px;color:#fff\">LOBBY<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:8px 22px 0;padding:16px;border-radius:18px;background:linear-gradient(90deg,#ffd23f,#ffbe3d);text-align:center;position:relative;overflow:hidden\">\n          <div style=\"font-weight:900;color:#7a5200;font-size:13px;letter-spacing:2px\">ROOM CODE — SHARE IT<\u002Fdiv>\n          <div style=\"font-family:'Lilita One';font-size:44px;color:#3a2500;letter-spacing:8px;line-height:1.05\">{{ roomCode }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow:auto;padding:18p }};box-shadow:0 5px 0 rgba(0,0,0,.35)\">{{ readyBtnLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ canStart }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ onStart }}\" style=\"flex:1;border:none;cursor:pointer;font-family:'Lilita One';font-size:18px;padding:16px;border-radius:16px;color:#3a2500;background:#4ecb71;box-shadow:0 5px 0 #2e9c4e\">START<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= GAME ================= -->\n    <sc-if value=\"{{ showGame }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:#8fd3ff\">\n        <canvas id=\"flappy-canvas\" ref=\"{{ setCanvas }}\" sc-camel-on-mouse-down=\"{{ onFlap }}\" sc-camel-on-touch-start=\"{{ onFlap }}\" style=\"width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer\"><\u002Fcanvas>\n        <!-- top status pills -->\n        <div style=\"position:absolute;top:0;left:0;right:0;padding:14px 12px 26px;display:flex;gap:7px;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent);pointer-events:none\">\n          <sc-for list=\"{{ hudPlayers }}\" as=\"p\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.9);opacity:{{ p.op }};box-shadow:0 3px 8px rgba(0,0,0,.2)\">\n              <span style=\"width:12px;height:12px;border-radius:50%;background:{{ p.color }}\"><\u002Fspan>\n              <span style=\"font-weight:900;font-size:12px;color:#12233d\">{{ p.name }}<\u002Fspan>\n              <span style=\"font-weight:900;font-size:12px;color:#12233d\">{{ p.score }}<\u002Fspan>\n              <span style=\"font-size:12px\">{{ p.icon }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <!-- countdown overlay -->\n        <sc-if value=\"{{ showCountdown }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none\">\n            <div style=\"font-family:'Lilita One';font-size:120px;color:#fff;text-shadow:0 6px 0 #f5a623,0 12px 30px rgba(0,0,0,.4);animation:cdPulse .95s ease-out\">{{ countdownText }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <!-- your dead banner while spectating -->\n        <sc-if value=\"{{ showSpectate }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;bottom:26px;left:0;right:0;text-align:center;pointer-events:none\">\n            <span style=\"font-family:'Lilita One';font-size:18px;color:#fff;background:rgba(0,0,0,.45);padding:8px 18px;border-radius:999px\">💀 You crashed — spectating…<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= RESULTS ================= -->\n    <sc-if value=\"{{ showResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#1f3b66,#0f1c33);animation:popIn .35s ease\">\n        <div style=\"padding:30px 24px 10px;text-align:center\">\n          <div style=\"font-family:'Lilita One';font-size:15px;letter-spacing:3px;color:#ffd23f\">{{ resultsKicker }}<\u002Fdiv>\n          <h2 style=\"font-family:'Lilita One';margin:6px 0 0;font-size:40px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25)\">{{ resultsTitle }}<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"margin:6px 24px 0;display:flex;flex-direction:column;align-items:center;gap:8px\">\n          <div style=\"animation:floaty 2.2s ease-in-out infinite\">\n            <svg width=\"130\" height=\"104\" sc-camel-view-box=\"0 0 120 96\"><ellipse cx=\"60\" cy=\"52\" rx=\"34\" ry=\"30\" fill=\"{{ winnerColor }}\"><\u002Fellipse><ellipse cx=\"60\" cy=\"60\" rx=\"26\" ry=\"20\" fill=\"rgba(255,255,255,.4)\"><\u002Fellipse><circle cx=\"76\" cy=\"42\" r=\"12\" fill=\"#fff\"><\u002Fcircle><circle cx=\"80\" cy=\"42\" r=\"6\" fill=\"#1a2233\"><\u002Fcircle><path d=\"M88 50 L108 46 L88 60 Z\" fill=\"#ff7a1a\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow:auto;padding:16px 24px 6px;display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ standings }}\" as=\"s\" hint-placeholder-count=\"1\">\n            <div style=\"display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:16px;background:{{ s.bg }};border:1px solid rgba(255,255,255,.08)\">\n              <span style=\"font-family:'Lilita One';font-size:20px;color:{{ s.rankColor }};width:30px\">{{ s.rankLabel }}<\u002Fspan>\n              <span style=\"width:28px;height:28px;border-radius:50%;background:{{ s.color }};flex:none\"><\u002Fspan>\n              <span style=\"flex:1;font-weight:900;color:#fff;font-size:16px\">{{ s.name }} {{ s.you }}<\u002Fspan>\n              <span style=\"font-weight:900;color:#ffd23f;font-size:16px\">{{ s.score }} <span style=\"font-size:12px;color:rgba(255,255,255,.5)\">pipes<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:12px 24px 28px;display:flex;gap:12px\">\n          <button sc-camel-on-click=\"{{ onBackMenu }}\" style=\"flex:1;border:none;cursor:pointer;font-family:'Lilita One';font-size:17px;padding:16px;border-radius:16px;color:#fff;background:rgba(255,255,255,.14)\">MENU<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onPlayAgain }}\" style=\"flex:1.4;border:none;cursor:pointer;font-family:'Lilita One';font-size:17px;padding:16px;border-radius:16px;color:#3a2500;background:#ffd23f;box-shadow:0 5px 0 #c98a00\">PLAY AGAIN<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= STATS ================= -->\n    <sc-if value=\"{{ showStats }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#1f3b66,#0f1c33)\">\n        <div style=\"padding:20px 22px 6px;display:flex;align-items:center;gap:12px\">\n          <button sc-camel-on-click=\"{{ onBackMenu }}\" style=\"border:none;background:rgba(255,255,255,.12);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:20px;font-weight:900;color:#fff\">‹<\u002Fbutton>\n          <div style=\"font-family:'Lilita One';font-size:22px;color:#fff\">MY STATS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:14px 22px 4px;display:grid;grid-template-columns:1fr 1fr;gap:11px\">\n          <div style=\"padding:16px;border-radius:18px;background:linear-gradient(90deg,#ffd23f,#ffbe3d)\">\n            <div style=\"font-weight:900;color:#7a5200;font-size:12px;letter-spacing:1px\">BEST SCORE<\u002Fdiv>\n            <div style=\"font-family:'Lilita One';font-size:38px;color:#3a2500;line-height:1\">{{ myBest }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)\">\n            <div style=\"font-weight:900;color:rgba(255,255,255,.55);font-size:12px;letter-spacing:1px\">WINS<\u002Fdiv>\n            <div style=\"font-family:'Lilita One';font-size:38px;color:#4ecb71;line-height:1\">{{ myWins }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center\">\n            <span style=\"font-weight:800;color:rgba(255,255,255,.6);font-size:14px\">Games<\u002Fspan>\n            <span style=\"font-family:'Lilita One';font-size:22px;color:#fff\">{{ myGames }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center\">\n            <span style=\"font-weight:800;color:rgba(255,255,255,.6);font-size:14px\">Total pipes<\u002Fspan>\n            <span style=\"font-family:'Lilita One';font-size:22px;color:#fff\">{{ myPipes }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 22px 4px;display:flex;align-items:center;gap:8px\">\n          <div style=\"font-family:'Lilita One';font-size:18px;color:#ffd23f\">🏆 GLOBAL TOP 10<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow:auto;padding:4px 22px 6px;display:flex;flex-direction:column;gap:8px\">\n          <sc-if value=\"{{ hasLeaderboard }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-for list=\"{{ leaderboard }}\" as=\"p\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)\">\n                <span style=\"font-family:'Lilita One';font-size:16px;color:#ffd23f;width:34px\">{{ p.rank }}<\u002Fspan>\n                <span style=\"flex:1;font-weight:900;color:#fff;font-size:15px\">{{ p.name }}<\u002Fspan>\n                <span style=\"font-weight:800;color:rgba(255,255,255,.5);font-size:13px\">{{ p.wins }}<\u002Fspan>\n                <span style=\"font-weight:900;color:#ffd23f;font-size:16px;width:46px;text-align:right\">{{ p.best }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ lbMessage }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:22px 14px;text-align:center;color:rgba(255,255,255,.5);font-weight:800;font-size:14px\">{{ lbMessage }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props); ();\n    // eye\n    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(r*0.58,-r*0.38,r*0.44,0,7); ctx.fill();\n    ctx.fillStyle='#1a2233'; ctx.beginPath(); ctx.arc(r*0.7,-r*0.38,r*0.21,0,7); ctx.fill();\n    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(r*0.63,-r*0.46,r*0.07,0,7); ctx.fill();\n    // beak (two-tone)\n    ctx.fillStyle='#ff8a1a'; ctx.beginPath(); ctx.moveTo(r*0.98,-r*0.1); ctx.lineTo(r*1.78,r*0.12); ctx.lineTo(r*0.98,r*0.28); ctx.closePath(); ctx.fill();\n    ctx.fillStyle='#e56b00'; ctx.beginPath(); ctx.moveTo(r*0.98,r*0.28); ctx.lineTo(r*1.78,r*0.12); ctx.lineTo(r*1.4,r*0.42); ctx.closePath(); ctx.fill();\n    if(!b.alive){ // X eye\n      ctx.strokeStyle='#1a2233'; ctx.lineWidth=r*0.16; ctx.lineCap='round'; ctx.beginPath();\n      ctx.moveTo(r*0.4,-r*0.58); ctx.lineTo(r*0.8,-r*0.18); ctx.moveTo(r*0.8,-r*0.58); ctx.lineTo(r*0.4,-r*0.18); ctx.stroke();\n    }\n    ctx.restore();\n    // name tag for others\n    if(!b.you && b.alive){\n      ctx.globalAlpha=0.95; ctx.textAlign='center';\n      ctx.font=\"800 \"+Math.round(r*0.92)+\"px 'Nunito', sans-serif\";\n      const ny=b.y - r*1.9;\n      const tw=ctx.measureText(b.name).width;\n      ctx.fillStyle='rgba(11,58,99,.55)'; this.pill(ctx, x-tw/2-r*0.4, ny-r*0.75, tw+r*0.8, r*1.1, r*0.55);\n      ctx.fillStyle='#fff'; ctx.fillText(b.name, x, ny);\n      ctx.textAlign='left'; ctx.globalAlpha=1;\n    }\n  }\n  pill(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }\n  shade(hex,pct){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255; const f=(v)=>Math.max(0,Math.min(255,Math.round(v+(pct/100)*255))); return 'rgb('+f(r)+','+f(g)+','+f(b)+')'; }\n\n  // ---------- render ----------\n  renderVals(){\n    const s=this.state;\n    const colors=this.COLORS.map(c=>({hex:c.hex, name:c.name, selected:c.hex===s.color, pick:()=>this.pickColor(c.hex)}));\n    const humanReady = s.players.filter(p=>!p.cpu).every(p=>p.ready);\n    const enough = s.players.length>=1;\n    const lobbyPlayers=s.players.map(p=>({\n      name:p.name, color:p.color,\n      tag: p.host?'👑':(p.cpu?'🤖':''),\n      status: p.you?(p.ready?'Ready':'Not ready — tap Ready'):(p.cpu?'CPU · ready':(p.ready?'Ready':'Waiting…')),\n      statusColor: p.ready?'#4ecb71':'rgba(255,255,255,.5)',\n      removable: p.cpu && s.iAmHost,\n      remove:()=>this.removeCpu(p.id)\n    }));\n    const rl=['🥇','🥈','🥉','4th'];\n    return {\n      showMenu:s.screen==='menu', showCustomize:s.screen==='customize', showJoin:s.screen==='join',\n      showLobby:s.screen==='lobby', showGame:s.screen==='game', showResults:s.screen==='results',\n      // customize\n      name:s.name, color:s.color, colors,\n      customizeTitle: s.nextAfterCustomize==='solo'?'PRACTICE':'YOUR BIRD',\n      customizeCta: s.nextAfterCustomize==='create'?'CREATE ROOM':(s.nextAfterCustomize==='join'?'CONTINUE':'CONTINUE'),\n      onCreateOpen:this.onCreateOpen, onJoinOpen:this.onJoinOpen, onSolo:this.onSolo,\n      onBackMenu:this.onBackMenu, onNameChange:this.onNameChange, onCustomizeContinue:this.onCustomizeContinue,\n      // join\n      joinCode:s.joinCode, onJoinCodeChange:this.onJoinCodeChange, onJoinSubmit:this.onJoinSubmit, error:s.error,\n      // lobby\n      roomCode:s.roomCode, lobbyPlayers,\n      canAddCpu: !this.online && s.iAmHost && s.players.length<4,\n      onAddCpu:this.onAddCpu,\n      readyBtnLabel: s.myReady?'✓ READY':'READY UP',\n      readyBtnColor: s.myReady?'#4ecb71':'#2fa8ff',\n      onToggleReady:this.onToggleReady,\n      canStart: s.iAmHost && s.myReady && humanReady && enough,\n      onStart:this.onStart, onLeave:this.onLeave,\n      lobbyHint: s.roomCode==='SOLO'?'Add CPU opponents · Ready up · then START':(s.iAmHost?'Share the code · Ready up · then START':'Waiting for the host to start…'),\n      // game\n      setCanvas:this.setCanvas, onFlap:this.onFlap,\n      hudPlayers:s.hudPlayers,\n      showCountdown:s.countdown>0, countdownText: s.countdown>0? ''+s.countdown : '',\n      showSpectate: s.mySpectating,\n      // results\n      standings:s.standings, winnerColor:s.winnerColor,\n      resultsKicker:s.resultsKicker, resultsTitle:s.resultsTitle,\n      onPlayAgain:this.onPlayAgain,\n      // stats\n      showStats: s.screen==='stats',\n      onStatsOpen: this.onStatsOpen,\n      myBest: ''+((s.myStats&&s.myStats.best)||0),\n      myGames: ''+((s.myStats&&s.myStats.games)||0),\n      myWins: ''+((s.myStats&&s.myStats.wins)||0),\n      myPipes: ''+((s.myStats&&s.myStats.pipes)||0),\n      leaderboard: (s.leaderboard||[]).map((p,i)=>({rank:'#'+(i+1), name:p.name, best:''+p.bestScore, wins:p.wins+' W'})),\n      hasLeaderboard: s.lbStatus==='ok',\n      lbMessage: s.lbStatus==='loading'?'Loading global ranking…':(s.lbStatus==='noserver'?'Connect the online server for a global ranking.':(s.lbStatus==='empty'?'No scores yet — be the first!':(s.lbStatus==='error'?'Could not reach the server.':'')))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
